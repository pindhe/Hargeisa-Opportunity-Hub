services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hoh
      POSTGRES_PASSWORD: hoh
      POSTGRES_DB: hoh
    ports:
      - "5432:5432"
    volumes:
      - hoh_pg:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      APP_ENV: development
      SECRET_KEY: change-this-to-a-long-random-string
      DATABASE_URL: postgresql+psycopg://hoh:hoh@db:5432/hoh
      CORS_ORIGINS: http://localhost:3000
      AUTO_CREATE_TABLES: "true"
    ports:
      - "8000:8000"
    depends_on:
      - db
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  hoh_pg:
